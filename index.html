<!doctype html>
<html>

<head>

  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>

  <script>
    AFRAME.registerComponent('room-bounds', {
      schema: {
        min: { default: -9.3 },
        max: { default: 9.3 }
      },
      tick: function () {
        var pos = this.el.object3D.position;
        pos.x = Math.min(this.data.max, Math.max(this.data.min, pos.x));
        pos.z = Math.min(this.data.max, Math.max(this.data.min, pos.z));
      }
    });
  </script>

  <script>
    // Draw a simple repeating brick pattern onto a canvas so we don't
    // depend on an external texture file for the wall material.
    window.addEventListener('DOMContentLoaded', function () {
      var canvas = document.getElementById('brick-canvas');
      var ctx = canvas.getContext('2d');
      var brickWidth = 64;
      var brickHeight = 32;
      var mortar = 4;

      ctx.fillStyle = '#9b9b93';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      for (var row = 0, y = 0; y < canvas.height; row++, y += brickHeight) {
        var offset = (row % 2 === 0) ? 0 : -brickWidth / 2;
        for (var x = offset; x < canvas.width; x += brickWidth) {
          var shade = 150 + Math.floor(Math.random() * 40);
          ctx.fillStyle = 'rgb(' + shade + ',' + Math.floor(shade * 0.42) + ',' + Math.floor(shade * 0.32) + ')';
          ctx.fillRect(x + mortar / 2, y + mortar / 2, brickWidth - mortar, brickHeight - mortar);
        }
      }
    });
  </script>

</head>

<body>

  <a-scene>

    <a-assets>
      <canvas id="brick-canvas" width="256" height="256"></canvas>
    </a-assets>

    <a-entity id="rig" camera look-controls wasd-controls="acceleration: 40" position="0 1.6 0" room-bounds>
    </a-entity>

    <a-plane
      position="0 0 0"
      rotation="-90 0 0"
      width="20"
      height="20"
      color="#333333">
    </a-plane>

    <!-- North wall -->
    <a-box
      position="0 2 -10"
      width="20.3"
      height="4"
      depth="0.3"
      material="src: #brick-canvas; repeat: 6 1">
    </a-box>

    <!-- South wall -->
    <a-box
      position="0 2 10"
      width="20.3"
      height="4"
      depth="0.3"
      material="src: #brick-canvas; repeat: 6 1">
    </a-box>

    <!-- East wall -->
    <a-box
      position="10 2 0"
      width="0.3"
      height="4"
      depth="20.3"
      material="src: #brick-canvas; repeat: 6 1">
    </a-box>

    <!-- West wall -->
    <a-box
      position="-10 2 0"
      width="0.3"
      height="4"
      depth="20.3"
      material="src: #brick-canvas; repeat: 6 1">
    </a-box>

    <a-light type="ambient" color="#ffffff" intensity="0.4"></a-light>

    <a-light
      type="point"
      position="0 3.8 0"
      intensity="0.9"
      distance="25">
    </a-light>

    <a-sky
      color="#87CEEB">
    </a-sky>

  </a-scene>

</body>

</html>
